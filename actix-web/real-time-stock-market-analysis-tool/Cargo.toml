[package]
name = "real-time-stock-market-analysis-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "4.1", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["actix-web"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
uuid = { version = "1.0", features = ["serde", "v4"] }
env_logger = "0.11"
log = "0.4"
yfinance-rs = { version = "0.7.2", features = ["dataframe"] }
paft = { version = "0.7.1", features = ["dataframe", "market"] }
polars = { version = "0.51", features = ["lazy", "temporal", "rolling_window"] }
futures-util = "0.3"
common-utils = { path = "../common-utils" }
